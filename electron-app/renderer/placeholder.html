<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #1e1e1e;
    }
    .placeholder {
      text-align: center;
      color: #7f7f7f;
      max-width: 380px;
      padding: 32px;
    }
    .placeholder .icon-mark {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      background: #ff6c37;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin: 0 auto 16px;
    }
    .placeholder h2 {
      color: #eeeeee;
      font-size: 16px;
      margin: 0 0 8px;
      font-weight: 600;
    }
    .placeholder p {
      font-size: 13px;
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="placeholder">
    <div class="icon-mark">🖥️</div>
    <h2>Live view</h2>
    <p>Pick Public or Authenticated on the left, then hit Start scrape — this panel will show LinkedIn live, scrolling and opening postings, as it's being read.</p>
  </div>
</body>
</html>
